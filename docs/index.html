<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NecroSpider CLI</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav">
        <a href="https://ch0udharyji.github.io/NecroSpider/" class="logo-link">
            <img src="assets/logo.png" alt="NecroSpider" class="logo">
        </a>
        <div class="links">
            <a href="docs.html">Docs</a>
            <a href="contributors.html">Contributors</a>
            <a href="https://crates.io/crates/necrospider-cli" target="_blank">Crates.io</a>
            <a href="https://github.com/ch0udharyji/NecroSpider" target="_blank">GitHub</a>
            <a href="https://ch0udharyji.com" target="_blank">ch0udharyji.com</a>
        </div>
    </nav>

    <main class="center-content">
        <h1 class="title">Automated OSINT Engine</h1>
        
        <div class="install-box">
            <code id="install-cmd">cargo install necrospider-cli</code>
            <button class="copy-btn" onclick="copyInstall()" title="Copy to clipboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
        </div>
        
        <p class="subtitle">A fast, interactive Rust TUI managing over 200 intelligence modules natively or via Docker.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
